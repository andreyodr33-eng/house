<!Doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="manifest.json"/>
    <title>English Trainer</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f2f2f2;
        margin: 0;
        padding: 20px;
      }
       html, body {
         height: 100%;
         overflow: hidden;
      }
      
      .top {
        text-align: center;
        margin-bottom: 15px;
      }
      select {
        font-size: 18px;
        padding: 8px;
      }

      .stats {
        font-size: 13px;
        opacity:0.8;
        white-space:nowrap;
      }
      .game {
         max-width: 900px;
         margin: auto;

         height: calc(100vh - 140px);

        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      .column {
        display: flex;
        flex-direction: column;
        gap: 10px;

        overflow-y: auto;
        padding-right: 5px;
     }
      
      .card {
        min-height: 50px;
        padding: 10px;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 20px;

        background: white;
        border: 2px solid #ccc;
        border-radius: 10px;
        cursor: pointer;
        word-break: break-word;
        min-height: 40px;
        max-height: 40px;
     }
      
      .card:hover {
        border-color: #2196F3;
        box-shadow: 0 3px 10px rgba(0,0,0,0.15);
     }
      
     .card:active {
         transform: scale(0.98);
         box-shadow: 0 2px 6px rgba(0,0,0,0.15);
     }

      .selected {
        border-color: #2196f3;
      }

      .correct {
        background: #4caf50;
        color: white;
        border-color: #4caf50;
      }

      .wrong {
        background: #f44336;
        color: white;
        border-color: #f44336;
      }
       .message {
        text-align: center;
        font-size: 24px;
        margin: 20px;
        height: 30px;
        
      }
      
      #modeBtn {
        font-size: 14px;
        padding: 6px 10px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }
      .column::-webkit-scrollbar {
         width: 6px;
      }

      .column::-webkit-scrollbar-thumb {
          background: #ccc;
          border-radius: 10px;
      }

    .game {
        display:grid;
        grid-template-columns: 1fr 1fr;
        gap:10px;
    }

     .add-panel{
    display:flex;
    gap:10px;
    justify-content:center;
    margin:10px 0;
}

.add-panel input{
    width:120px;
    padding:6px;
    font-size:14px;
}

.add-panel button{
    padding:6px 10px;
}
.card{
    position:relative;
}

.delete-btn{
    position:absolute;
    top:4px;
    right:6px;

    font-size:12px;

    cursor:pointer;

    opacity:0.6;
}

.delete-btn:hover{
    opacity:1;
}

 .history {
    position: fixed;
    top: 60px;
    left: 10px;
    right: 10px;
    bottom: 10px;

    background: white;
    overflow-y: auto;

    padding: 10px;

    border-radius: 10px;

    box-shadow: 0 0 10px rgba(0,0,0,0.2);
}

.hidden {
    display: none;
}

.history-item {
    font-size: 18px;
    padding: 18px;
    border-bottom: 1px solid #eee;
}
    </style>
   <body>
    <div class="top">
      <button id="modeBtn">👂</button>
      <button id="historyBtn">📜</button>
    <div class="add-panel"> 
    <input id="ru" placeholder="Русский">
    <input id="en" placeholder="English">
    <button onclick="addWord()">➕📦</button>
    </div>
  </div>
      <div class="message" id="message"></div>
    
   <div class="game">
      <div class="column" id="leftColumn"></div>
      <div class="column" id="rightColumn"></div>
    </div>
    <div id="historyPanel" class="history hidden"></div>
<script>

let db;

const request = indexedDB.open("LingoMatchDB", 1);

request.onupgradeneeded = function(e){
    db = e.target.result;

    db.createObjectStore("words", {
        keyPath: "id",
        autoIncrement: true
    });
};

request.onsuccess = function(e){
    db = e.target.result;

    loadWordsAndStart(); // ⚠️ старт игры только тут
};
   
         const WORDS = [

 { id: 1, ru: "кот", en: "cat" },
 { id: 2, ru: "собака", en: "dog" },
 { id: 3, ru: "дом", en: "house" },
 { id: 4, ru: "яблоко", en: "apple" },
 { id: 5, ru: "книга", en: "book" },
 { id: 6, ru: "вода", en: "water" },
 { id: 7, ru: "солнце", en: "sun" },
 { id: 8, ru: "машина", en: "car" },
 { id: 9, ru: "дерево", en: "tree" },
 { id: 10, ru: "море", en: "sea" },
 { id: 11, ru: "доброе утро", en: "good morning" },
 { id: 12, ru: "спасибо", en: "thank you" },
 { id: 13, ru: "до свидания", en: "goodbye" },
 { id: 14, ru: "как дела", en: "how are you" },
 { id: 15, ru: "сколько это будет стоить", en: "how much is it" },
 { id: 16, ru: "я работаю здесь уже пять лет", en:"i have been working here for five years"},

]
      let allWords = [];
      let currenIndex = 0;

      const WORDS_PER_ROUND = 5;
      let solvedPairs = 0;
      let currentMode = "audio";
      
      let selectedLeft = null;
      let selectedRight = null;

     function shuffle(arr) {
        return [...arr].sort(() => Math.random() - 0.5);
      }
     
     function startGame(words){
     solvedPairs = 0;
    // сбрасываем состояние
    selectedLeft = null;
    selectedRight = null;

    const leftCol = document.getElementById("leftColumn");
    const rightCol = document.getElementById("rightColumn");

    // очистка поля
    leftCol.innerHTML = "";
    rightCol.innerHTML = "";

    // перемешиваем слова
    const shuffledLeft = [...words].sort(() => Math.random() - 0.5);
    const shuffledRight = [...words].sort(() => Math.random() - 0.5);

    // создаём левую колонку (русский)
    
   shuffledLeft.forEach(word => {

    const card = document.createElement("div");
    card.className = "card";
     if(currentMode === "reverse"){
       card.textContent = word.en;
    }else{
       card.textContent = word.ru;
    }

    card.dataset.id = word.id;
    card.dataset.en = word.en;

    if(word.custom){

        const del = document.createElement("span");

        del.className = "delete-btn";

        del.textContent = "✕";

        del.onclick = (e)=>{
            e.stopPropagation();
            deleteWord(word.id);
        };

        card.appendChild(del);
    }

    card.onclick = () => selectLeft(card);

    leftCol.appendChild(card);
    fitText(card);
});
   

    // создаём правую колонку (английский, скрыт)
    shuffledRight.forEach(word => {

        const card = document.createElement("div");
        card.className = "card";

        // английский скрыт по умолчанию
       if (currentMode === "audio") {
        card.textContent = "🔊";
    }

       if (currentMode === "visual") {
        card.textContent = word.en;
    }

       if (currentMode === "reverse") {
          card.textContent = word.ru;
    }
        card.dataset.id = word.id;  
        card.dataset.en = word.en;

        card.onclick = () => selectRight(card);

        rightCol.appendChild(card);
        fitText(card);
    });
 }

     function deleteWord(id){

    const tx = db.transaction("words","readwrite");
    const store = tx.objectStore("words");
    store.delete(id);
    tx.oncomplete = ()=>{
        loadWordsAndStart();
    };
} 

      function loadWordsAndStart(){

       getCustomWords(customWords => {

      const markedCustomWords = customWords.map(word => ({
             ...word,
             custom: true
         }));

        allWords = shuffle([
             ...WORDS,
             ...markedCustomWords
       ]);
         currentIndex = 0;
         showNextRound();
       });
  }

      function showNextRound(){

    if(currentIndex >= allWords.length){
        allWords = shuffle(allWords);
        currentIndex = 0;
    }

    let roundWords =
        allWords.slice(
            currentIndex,
            currentIndex + WORDS_PER_ROUND
        );

    // 👉 если не хватает до 5 — добираем с начала
    if(roundWords.length < WORDS_PER_ROUND){

        const missing =
            WORDS_PER_ROUND - roundWords.length;

        roundWords = roundWords.concat(
            allWords.slice(0, missing)
        );
    }

    currentIndex += WORDS_PER_ROUND;

    startGame(roundWords);
}
      function getCustomWords(callback){

      const tx = db.transaction("words", "readonly");
      const store = tx.objectStore("words");

      const req = store.getAll();

      req.onsuccess = () => {
        callback(req.result || []);
    };
 }
      
   function speak(text){
    const utterance = new SpeechSynthesisUtterance(text);

    utterance.lang = "en-US";

    const voices = speechSynthesis.getVoices();

    const englishVoice = voices.find(v =>
        v.lang.includes("en")
    );

    if(englishVoice){
        utterance.voice = englishVoice;
    }

    speechSynthesis.speak(utterance);
}

    function fitText(card){

    let size = 20;

    card.style.fontSize = size + "px";

    while(
        card.scrollHeight > card.clientHeight &&
        size > 12
    ){
        size--;
        card.style.fontSize = size + "px";
    }
}
function addWord(){

    const ru = document.getElementById("ru").value;
    const en = document.getElementById("en").value;

    if(!ru || !en) return;

    const tx = db.transaction("words", "readwrite");
    const store = tx.objectStore("words");

    store.add({ ru, en });

    document.getElementById("ru").value = "";
    document.getElementById("en").value = "";

    loadWordsAndStart();
}
      

      function selectLeft(card) {
        if (card.classList.contains("correct")) return;
        const mode = currentMode;

        if (mode === "reverse") {
          speak(card.dataset.en);
        }
        document
          .querySelectorAll("#leftColumn .selected")
          .forEach((c) => c.classList.remove("selected"));

        selectedLeft = card;

        card.classList.add("selected");

        checkMatch();
      }
      function loadHistory(){

    const tx = db.transaction("words","readonly");
    const store = tx.objectStore("words");

    const req = store.getAll();

    req.onsuccess = () => {

        const panel = document.getElementById("historyPanel");

        panel.innerHTML = "";

        req.result.forEach(word => {

            const div =
                document.createElement("div");

            div.className = "history-item";

            div.textContent =
                `${word.ru} — ${word.en}`;

            panel.appendChild(div);
        });
    };
}
      document.getElementById("historyBtn")
      .addEventListener("click", () => {

      const panel = document.getElementById("historyPanel");

      if(panel.classList.contains("hidden")){

        loadHistory();
        panel.classList.remove("hidden");

      } else {
         panel.classList.add("hidden");
     }
  });

      function selectRight(card) {
        if (card.classList.contains("correct")) return;

        const mode = currentMode;

        if (mode !== "reverse") {
          speak(card.dataset.en);
        }

        document
          .querySelectorAll("#rightColumn .selected")
          .forEach((c) => c.classList.remove("selected"));

        selectedRight = card;

        card.classList.add("selected");

        checkMatch();
      }

      function checkMatch() {
        if (!selectedLeft || !selectedRight) return;

        const ok = selectedLeft.dataset.id === selectedRight.dataset.id;

        if (ok) {
          selectedLeft.classList.remove("selected");
          selectedRight.classList.remove("selected");

          selectedLeft.classList.add("correct");
          selectedRight.classList.add("correct");

          if (currentMode === "audio") {
            selectedRight.textContent = selectedRight.dataset.en;

            speak(selectedRight.dataset.en);
          }
         solvedPairs++;

         if(solvedPairs === WORDS_PER_ROUND){

            currentIndex += WORDS_PER_ROUND;

            if(currentIndex >= allWords.length){

                 allWords = shuffle(allWords);
                 currentIndex = 0;
       }

        setTimeout(() => {
           showNextRound();
        }, 1000);
  }
     selectedLeft = null;
     selectedRight = null; 
      
        } else {
          selectedLeft.classList.add("wrong");
          selectedRight.classList.add("wrong");

          setTimeout(() => {
            selectedLeft.classList.remove("wrong", "selected");

            selectedRight.classList.remove("wrong", "selected");
        selectedLeft = null;
        selectedRight = null; 
            
          }, 800);
        }
      }

      document
        .getElementById("modeBtn")
        
      const modeBtn = document.getElementById("modeBtn");

      modeBtn.addEventListener("click", () => {
        if (currentMode === "audio") {
          currentMode = "visual";
          modeBtn.textContent = "👁";
        } else if (currentMode === "visual") {
          currentMode = "reverse";
          modeBtn.textContent = "⇄";
        } else {
          currentMode = "audio";
          modeBtn.textContent = "👂";
        }

        loadWordsAndStart();
      });
      
      </script>
     <script>
      if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/house/service-worker.js")
      .then(() => console.log("Service Worker registered"));
   }
    </script>
  </head>
 </body>
</html>
